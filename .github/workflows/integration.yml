name: Integration

# Live tests against the real BDNS API. Kept out of CI so a pull request is
# never blocked by a third-party outage; run nightly instead, so a change in
# the API is noticed within a day.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Each job installs what it needs with an explicit `uv sync`; `uv run` must
# use exactly that, not sync again with the default groups.
env:
  UV_NO_SYNC: "1"

jobs:
  live-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-group docs

      - name: Test against the live API
        run: uv run pytest -m integration --no-cov
