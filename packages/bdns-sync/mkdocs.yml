site_name: BDNS Sync
site_description: >-
  Motor de sincronización que mantiene bases de datos de destino en forma
  SCD2 a partir de la API de la Base de Datos Nacional de Subvenciones.
site_url: https://cruzlorite.github.io/bdns-sync/
repo_url: https://github.com/cruzlorite/bdns-sync
repo_name: cruzlorite/bdns-sync
edit_uri: edit/main/docs/
copyright: "Licencia MIT · Proyecto no oficial, sin relación con la BDNS ni con el Ministerio de Hacienda"

theme:
  name: material
  language: es
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
    logo: material/database-sync
  features:
    # navigation.instant is deliberately absent: it is incompatible with
    # the i18n language switcher's contextual link.
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Seguir el sistema
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Modo claro

# A link to a missing anchor is a broken link; the default only logs it.
validation:
  anchors: warn

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # Turns :material-*: / :octicons-*: shortcodes into inline SVG icons.
  # Without it they render as literal text.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

plugins:
  - search:
      lang: [es, en]
  # Spanish is canonical: `foo.md` is Spanish, `foo.en.md` is its English
  # translation. Pages with no translation fall back to the Spanish one.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: es
          name: Español
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_description: >-
            Sync engine that keeps target databases in SCD2 form from the
            Base de Datos Nacional de Subvenciones (BDNS) API.
          copyright: "MIT license · Unofficial project, not affiliated with the BDNS or Spain's Ministerio de Hacienda"
          # Merged by index into theme.palette: only the toggle labels change.
          theme:
            palette:
              - toggle:
                  name: Follow the system
              - toggle:
                  name: Switch to dark mode
              - toggle:
                  name: Switch to light mode
          nav_translations:
            Inicio: Home
            Primeros pasos: Get started
            Guías: How-to guides
            Conceptos: Explanation
            Referencia: Reference
            API Python: Python API
            Decisiones de diseño: Decisions
            Cómo contribuir: Contributing
            Hoja de ruta: Roadmap
            Compatibilidad: Compatibility
  # The reference is built once per locale, so every symbol has one URL per
  # language and autorefs sees competing targets. `resolve_closest` picks
  # the one in the same subtree as the linking page, which is the right
  # answer: a Spanish page links to the Spanish build.
  - autorefs:
      resolve_closest: true
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: table
            show_source: true
            show_root_heading: false
            show_root_full_path: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            members_order: source
            filters: []
            # `[name][]` in a docstring resolves against the names in scope,
            # so a docstring can link a sibling without spelling its path.
            scoped_crossrefs: true

nav:
  - Inicio: index.md
  - Primeros pasos: getting-started.md
  - Guías:
      - guides/scheduling.md
      - guides/backfill.md
      - guides/deployment.md
  - Conceptos:
      - explanation/endpoint-types.md
      - explanation/payload-policy.md
      - explanation/sync-behavior.md
      - explanation/official-practices.md
      - explanation/data-caveats.md
      - explanation/limitations.md
      - explanation/sinks.md
  - Referencia:
      - reference/cli.md
      - reference/data-model.md
      - API Python:
          - reference/api/index.md
          - reference/api/entities.md
          - reference/api/windows.md
          - reference/api/orchestration.md
          - reference/api/policy.md
          - reference/api/hashing.md
          - reference/api/pipeline.md
          - reference/api/sinks.md
          - reference/api/cli.md
          - reference/api/sinks.sql.md
          - reference/api/sinks.sql.scd2.md
          - reference/api/sinks.sql.schema.md
          - reference/api/sinks.sql.bookkeeping.md
          - reference/api/sinks.sql.migrate.md
          - reference/api/sinks.sql.dialects.md
  - Decisiones de diseño:
      - adr/index.md
      - adr/0001-store-whole-record-version-by-hash.md
      - adr/0002-staging-and-bulk-diff.md
      - adr/0003-run-event-log.md
      - adr/0004-beneficiario-out-of-hash.md
      - adr/0005-per-run-reject-tolerance.md
      - adr/0006-entity-registry.md
      - adr/0007-cadence-in-the-cli.md
      - adr/0008-run-linked-versions-additive-migrations.md
      - adr/0009-natural-key-conflicts-fail-the-run.md
      - adr/0010-api-semantics-from-bdns-fetch.md
  - Cómo contribuir:
      - contributing/docstrings.md
  - Compatibilidad: compatibility.md
  - Hoja de ruta: roadmap.md
