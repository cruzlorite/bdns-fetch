name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    # Unit tests only: HTTP is mocked, so the result depends on this
    # repository alone. The live API is exercised by integration.yml.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry==2.2.1

      - name: Install dependencies
        run: poetry install

      - name: Lint
        run: poetry run ruff check .

      - name: Check formatting
        run: poetry run ruff format --check .

      - name: Check doc references
        run: poetry run python scripts/check_doc_refs.py

      - name: Check docstring conventions
        run: poetry run python scripts/check_docstrings.py

      - name: Build docs
        run: poetry run mkdocs build --strict

      - name: Check site links
        run: poetry run python scripts/check_site_links.py

      - name: Test
        run: poetry run pytest
