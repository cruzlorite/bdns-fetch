name: Docs

# The site documents the latest release, so publish.yml deploys it once a
# release has reached PyPI, never on a push to main (which may hold
# unreleased changes). workflow_dispatch republishes it by hand: run it from
# the release tag, or from main for a documentation-only fix when main holds
# nothing unreleased.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Each job installs what it needs with an explicit `uv sync`; `uv run` must
# use exactly that, not sync again with the default groups.
env:
  UV_NO_SYNC: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --only-group docs

      - name: Build
        run: uv run mkdocs build --strict

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # One deployment at a time. A newer one queues behind the one in flight
    # rather than cancelling it halfway through publishing.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write  # OIDC token for the Pages deployment; no stored secret
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
