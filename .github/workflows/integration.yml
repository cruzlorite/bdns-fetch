name: Integration

# Live tests against the real BDNS API. Kept out of CI so a pull request is
# never blocked by a third-party outage; run nightly instead, so a change in
# the API is noticed within a day.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  live-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.2.1

      - name: Install dependencies
        run: poetry install

      - name: Test against the live API
        run: poetry run pytest -m integration --no-cov
