          - fetch/adr/0001-api-parameter-names-keyword-only.md
          - fetch/adr/0002-retry-only-transient-failures.md
          - fetch/adr/0003-spaced-requests-no-bursts.md
          - fetch/adr/0004-records-as-plain-dicts.md
          - fetch/adr/0005-ordered-bounded-pagination.md
          - fetch/adr/0006-cli-generated-from-client.md
          - fetch/adr/0007-api-knowledge-lives-in-fetch.md
          - fetch/adr/0008-one-call-at-a-time.md
  - BDNS Sync:
      - sync/index.md
      - Primeros pasos: sync/getting-started.md
      - Guías:
          - sync/guides/scheduling.md
          - sync/guides/backfill.md
          - sync/guides/deployment.md
      - Conceptos:
          - sync/explanation/endpoint-types.md
          - sync/explanation/payload-policy.md
          - sync/explanation/sync-behavior.md
          - sync/explanation/official-practices.md
          - sync/explanation/data-caveats.md
          - sync/explanation/limitations.md
          - sync/explanation/sinks.md
      - Referencia:
          - sync/reference/cli.md
          - sync/reference/data-model.md
          - API Python:
              - sync/reference/api/index.md
              - sync/reference/api/entities.md
              - sync/reference/api/windows.md
              - sync/reference/api/orchestration.md
              - sync/reference/api/policy.md
              - sync/reference/api/hashing.md
              - sync/reference/api/pipeline.md
              - sync/reference/api/sinks.md
              - sync/reference/api/cli.md
              - sync/reference/api/sinks.sql.md
              - sync/reference/api/sinks.sql.scd2.md
              - sync/reference/api/sinks.sql.schema.md
              - sync/reference/api/sinks.sql.bookkeeping.md
              - sync/reference/api/sinks.sql.migrate.md
              - sync/reference/api/sinks.sql.dialects.md
      - Decisiones de diseño:
          - sync/adr/index.md
          - sync/adr/0001-store-whole-record-version-by-hash.md
          - sync/adr/0002-staging-and-bulk-diff.md
          - sync/adr/0003-run-event-log.md
          - sync/adr/0004-beneficiario-out-of-hash.md
          - sync/adr/0005-per-run-reject-tolerance.md
          - sync/adr/0006-entity-registry.md
          - sync/adr/0007-cadence-in-the-cli.md
          - sync/adr/0008-run-linked-versions-additive-migrations.md
          - sync/adr/0009-natural-key-conflicts-fail-the-run.md
          - sync/adr/0010-api-semantics-from-bdns-fetch.md
  - Proyecto:
      - Compatibilidad: compatibility.md
      - Hoja de ruta: roadmap.md
      - Aviso legal: legal.md
      - Decisiones comunes:
          - adr/index.md
          - adr/0001-one-package.md
      - Cómo contribuir:
