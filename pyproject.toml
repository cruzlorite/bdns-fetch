[tool.poetry]
packages = [{ include = "bdns", from = "src" }]
name = "bdns-fetch"
version = "1.3.0"
description = "Python client and CLI to fetch data from the Base de Datos Nacional de Subvenciones (BDNS)"
readme = "README.md"
authors = ["José María Cruz Lorite <josemariacruzlorite@gmail.com>"]
license = "MIT"
homepage = "https://github.com/cruzlorite/bdns-fetch"
repository = "https://github.com/cruzlorite/bdns-fetch"
documentation = "https://github.com/cruzlorite/bdns-fetch#readme"
keywords = ["bdns", "subsidies", "spanish-government", "api", "data", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
requests = "^2.32.5"
typer = "^0.17.4"
tqdm = "^4.67.1"
tenacity = "^9.1.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
pytest-cov = "^6.3.0"
pytest-mock = "^3.15.0"
ruff = "^0.12.12"
responses = "^0.25"


[tool.poetry.group.docs.dependencies]
mkdocs-material = "^9.7.7"
mkdocstrings = {version = "^1.0.6", extras = ["python"]}
mkdocs-static-i18n = "^1.3.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
bdns-fetch = "bdns.fetch.__main__:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = [
    "E741",  # ambiguous variable name (O is required by API)
    "E501",  # long lines: help texts and URLs read better unbroken
    "D105",  # magic methods: covered by the class docstring
    "D107",  # __init__: documented on the class
]

[tool.ruff.lint.flake8-bugbear]
# Typer declares options as argument defaults; they are evaluated once, by design.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
