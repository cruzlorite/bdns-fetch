name: Release

# A vX.Y.Z tag releases that version. PyPI goes first; the Docker image, the
# GitHub release and the documentation site follow only once it has
# succeeded, so none of them can announce a version PyPI rejected. The file
# keeps the name publish.yml because the PyPI trusted publisher is bound to it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # OIDC token for PyPI trusted publishing; no API key needed

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.2.1

      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(poetry version --short)"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match pyproject version $version" >&2
            exit 1
          fi

      - name: Check the changelog has this version
        run: python scripts/release_notes.py "${GITHUB_REF_NAME#v}" > /dev/null

      - name: Install dependencies
        run: poetry install

      - name: Test
        run: poetry run pytest

      - name: Build
        run: poetry build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

      # The GitHub release attaches the very files PyPI received.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  image:
    needs: publish  # no image for a version PyPI rejected
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker build \
            -t "ghcr.io/${{ github.repository }}:$version" \
            -t "ghcr.io/${{ github.repository }}:latest" \
            .
          docker push --all-tags "ghcr.io/${{ github.repository }}"

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT: ${{ github.event.repository.name }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/release_notes.py "$version" > notes.md
          prerelease=""
          case "$version" in *[a-z]*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$PROJECT $version" \
            --notes-file notes.md \
            $prerelease

  docs:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
