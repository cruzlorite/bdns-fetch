name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Each job installs what it needs with an explicit `uv sync`; `uv run` must
# use exactly that, not sync again with the default groups.
env:
  UV_NO_SYNC: "1"

jobs:
  # Lint, formatting and the documentation site cover the whole repository,
  # so they run once rather than per Python version.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check doc references
        run: uv run python scripts/check_doc_refs.py

      - name: Check docstring conventions
        run: uv run python scripts/check_docstrings.py

      - name: Build docs
        run: uv run mkdocs build --strict

      - name: Check site links
        run: uv run python scripts/check_site_links.py

  # The suite runs on in-memory SQLite (the default, no service needed),
  # then bdns.sync's tests run again against a real PostgreSQL and DuckDB:
  # its SQL-facing tests pick their engine from BDNS_SYNC_TEST_URL. Without
  # this, "portable SQL" was an untested claim: a bare NULL literal in the
  # version INSERT compiled fine on SQLite and was rejected by PostgreSQL on
  # every single run. HTTP is mocked throughout; the live API is exercised
  # by integration.yml.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: bdns
          POSTGRES_DB: bdns
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-group docs

      - name: Test (SQLite)
        run: uv run pytest

      - name: Test bdns.sync (PostgreSQL)
        env:
          BDNS_SYNC_TEST_URL: postgresql+psycopg2://postgres:bdns@localhost:5432/bdns
        run: uv run pytest tests/sync --no-cov

      - name: Test bdns.sync (DuckDB)
        env:
          BDNS_SYNC_TEST_URL: duckdb:///${{ runner.temp }}/bdns-test.duckdb
        run: uv run pytest tests/sync --no-cov

  # The image is otherwise built only on release, when a broken Dockerfile
  # would be found with the version already on PyPI.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Build the image
        run: docker build -t bdns-sync:ci .

      - name: Check the image runs
        run: docker run --rm bdns-sync:ci bdns-sync --version
