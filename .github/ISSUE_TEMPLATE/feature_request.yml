name: Propuesta / Feature request
description: Una funcionalidad o cambio de comportamiento. / A feature or a change in behaviour.
labels: [enhancement]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Herramienta / Tool
      options:
        - bdns-fetch
        - bdns-sync
        - Documentación / Documentation
        - Otra / Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problema / Problem
      description: Qué necesitas hacer y por qué hoy no puedes. / What you need to do and why you cannot today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Propuesta / Proposal
      description: Cómo lo resolverías, si tienes una idea. / How you would solve it, if you have an idea.
