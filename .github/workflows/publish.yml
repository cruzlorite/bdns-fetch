name: Release

# A vX.Y.Z tag releases that version. PyPI goes first; the Docker image, the
# GitHub release and the documentation site follow only once it has
# succeeded, so none of them can announce a version PyPI rejected. The file
# keeps the name publish.yml because the PyPI trusted publisher is bound to
# it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Each job installs what it needs with an explicit `uv sync`; `uv run` must
# use exactly that, not sync again with the default groups.
env:
  UV_NO_SYNC: "1"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # OIDC token for PyPI trusted publishing; no API key needed

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.12"

      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv version --short)"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match pyproject version $version" >&2
            exit 1
          fi

      - name: Check the changelog has this version
        run: python3 scripts/release_notes.py "${GITHUB_REF_NAME#v}" > /dev/null

      - name: Install dependencies
        run: uv sync --frozen --no-group docs

      - name: Test
        run: uv run pytest

      - name: Build
        run: uv build --out-dir dist/

      # The tests above import the package from src/. Running them again on
      # the built wheel, installed from scratch, catches a file the build
      # leaves out or a dependency only the development setup provides.
      - name: Test the built package
        run: |
          uv export --only-group dev --frozen --no-hashes --no-emit-project -o "$RUNNER_TEMP/dev.txt"
          uv venv "$RUNNER_TEMP/released"
          uv pip install --python "$RUNNER_TEMP/released" dist/*.whl -r "$RUNNER_TEMP/dev.txt"
          "$RUNNER_TEMP/released/bin/python" -m pytest --no-cov -p no:cacheprovider

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

      # The GitHub release attaches the very files PyPI received.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  image:
    needs: publish  # no image for a version PyPI rejected
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # The image is named after the command it runs by default, whatever
      # the repository is called.
      - name: Build and push image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/bdns-sync
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker build -t "$IMAGE:$version" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/release_notes.py "$version" > notes.md
          prerelease=""
          case "$version" in *[a-z]*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "bdns-tools $version" \
            --notes-file notes.md \
            $prerelease

  docs:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
