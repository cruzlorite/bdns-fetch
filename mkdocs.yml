site_name: BDNS
site_description: >-
  Herramientas para descargar, conservar y reutilizar los datos de la Base
  de Datos Nacional de Subvenciones (BDNS).
site_url: https://cruzlorite.github.io/bdns/
repo_url: https://github.com/cruzlorite/bdns
repo_name: cruzlorite/bdns
edit_uri: edit/main/docs/
copyright: 'Licencia MIT · Proyecto no oficial, sin relación con la BDNS ni con el Ministerio de Hacienda · <a href="/bdns/legal/">Aviso legal</a>'

theme:
  name: material
  language: es
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
    logo: material/database-sync
  features:
    # navigation.instant is deliberately absent: it is incompatible with
    # the i18n language switcher's contextual link.
    - navigation.sections
    - navigation.path
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow
  # Dark by default, with a black header; the light mode keeps Material's
  # indigo header. The accent is indigo in both.
  palette:
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Modo claro
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Modo oscuro

# The home page's header, tables and cards; see the file.
extra_css:
  - assets/stylesheets/extra.css

# Snippets that are appended to pages, not pages themselves.
exclude_docs: |
  includes/

# A link to a missing anchor is a broken link; the default only logs it.
validation:
  anchors: warn

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # Turns :material-*: / :octicons-*: shortcodes into inline SVG icons.
  # Without it they render as literal text.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      # Marks each block with its language (language-console...), which
      # extra.css uses to wrap terminal sessions instead of scrolling them.
      pygments_lang_class: true
  - pymdownx.inlinehilite
  # Every page gets the glossary, so BDNS, SCD2, NIF... show their meaning
  # on hover (content.tooltips) wherever they appear in running text.
  - pymdownx.snippets:
      auto_append:
        - docs/includes/abbreviations.md

plugins:
  - search:
      lang: [es, en]
  # Downloads the fonts and any other external asset at build time and
  # serves them from the site, so visiting it makes no third-party requests.
  - privacy
  # Spanish is canonical: `foo.md` is Spanish, `foo.en.md` is its English
  # translation. Pages with no translation fall back to the Spanish one.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: es
          name: Español
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_description: >-
            Tools to download, keep and reuse the data of Spain's National
            Subsidies Database (BDNS).
          copyright: 'MIT license · Unofficial project, not affiliated with the BDNS or Spain''s Ministerio de Hacienda · <a href="/bdns/en/legal/">Legal notice</a>'
          # Merged by index into theme.palette: only the toggle labels change.
          theme:
            palette:
              - toggle:
                  name: Switch to light mode
              - toggle:
                  name: Switch to dark mode
          nav_translations:
            Inicio: Home
            Primeros pasos: Get started
            Guías: How-to guides
            Conceptos: Explanation
            Referencia: Reference
            API Python: Python API
            Decisiones de diseño: Decisions
            Cómo contribuir: Contributing
            Compatibilidad: Compatibility
            Hoja de ruta: Roadmap
            Aviso legal: Legal notice
            Proyecto: Project
            Decisiones comunes: Shared decisions
  # The reference is built once per locale, so every symbol has one URL per
  # language and autorefs sees competing targets. `resolve_closest` picks
  # the one in the same subtree as the linking page, which is the right
  # answer: a Spanish page links to the Spanish build.
  - autorefs:
      resolve_closest: true
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: table
            show_source: true
            show_root_heading: false
            show_root_full_path: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            members_order: source
            filters: []
            # `[name][]` in a docstring resolves against the names in scope,
            # so a docstring can link a sibling without spelling its path.
            scoped_crossrefs: true

nav:
  - Inicio: index.md
  - BDNS Fetch:
      - fetch/index.md
      - Primeros pasos: fetch/getting-started.md
      - Guías:
          - fetch/guides/incremental.md
          - fetch/guides/errors.md
          - fetch/guides/other-endpoints.md
      - Conceptos:
          - fetch/explanation/api-behavior.md
          - fetch/explanation/policies.md
      - Referencia:
          - fetch/reference/cli.md
          - API Python:
              - fetch/reference/api/index.md
              - fetch/reference/api/client.md
              - fetch/reference/api/exceptions.md
              - fetch/reference/api/dates.md
              - fetch/reference/api/contract.md
              - fetch/reference/api/types.md
              - fetch/reference/api/utils.md
              - fetch/reference/api/endpoints.md
              - fetch/reference/api/options.md
              - fetch/reference/api/cli.md
      - Decisiones de diseño:
