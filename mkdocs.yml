site_name: BDNS Fetch
site_description: >-
  Cliente Python y CLI para la API de la Base de Datos Nacional de
  Subvenciones (BDNS).
site_url: https://cruzlorite.github.io/bdns-fetch/
repo_url: https://github.com/cruzlorite/bdns-fetch
repo_name: cruzlorite/bdns-fetch
edit_uri: edit/main/docs/
copyright: "Licencia MIT · Proyecto no oficial, sin relación con la BDNS ni con el Ministerio de Hacienda"

theme:
  name: material
  language: es
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
    logo: material/cloud-download
  features:
    # navigation.instant is deliberately absent: it is incompatible with
    # the i18n language switcher's contextual link.
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Seguir el sistema
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Modo claro

# A link to a missing anchor is a broken link; the default only logs it.
validation:
  anchors: warn

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

plugins:
  - search:
      lang: [es, en]
  # Spanish is canonical: `foo.md` is Spanish, `foo.en.md` is its English
  # translation. Pages with no translation fall back to the Spanish one.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: es
          name: Español
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_description: >-
            Python client and CLI for the API of Spain's National Subsidies
            Database (BDNS).
          copyright: "MIT license · Unofficial project, not affiliated with the BDNS or Spain's Ministerio de Hacienda"
          theme:
            palette:
              - toggle:
                  name: Follow the system
              - toggle:
                  name: Switch to dark mode
              - toggle:
                  name: Switch to light mode
          nav_translations:
            Inicio: Home
            Primeros pasos: Get started
            Guías: How-to guides
            Conceptos: Explanation
            Referencia: Reference
            API Python: Python API
            Decisiones de diseño: Decisions
            Cómo contribuir: Contributing
            Compatibilidad: Compatibility
  - autorefs:
      resolve_closest: true
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: table
            show_source: true
            show_root_heading: false
            show_root_full_path: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            members_order: source
            filters: []
            scoped_crossrefs: true

nav:
  - Inicio: index.md
  - Primeros pasos: getting-started.md
  - Guías:
      - guides/incremental.md
      - guides/errors.md
      - guides/other-endpoints.md
  - Conceptos:
      - explanation/api-behavior.md
      - explanation/policies.md
  - Referencia:
      - reference/cli.md
      - API Python:
          - reference/api/index.md
          - reference/api/client.md
          - reference/api/exceptions.md
          - reference/api/dates.md
          - reference/api/contract.md
          - reference/api/types.md
          - reference/api/utils.md
          - reference/api/endpoints.md
          - reference/api/options.md
          - reference/api/cli.md
  - Decisiones de diseño:
      - adr/index.md
      - adr/0001-api-parameter-names-keyword-only.md
      - adr/0002-retry-only-transient-failures.md
      - adr/0003-spaced-requests-no-bursts.md
      - adr/0004-records-as-plain-dicts.md
      - adr/0005-ordered-bounded-pagination.md
      - adr/0006-cli-generated-from-client.md
      - adr/0007-api-knowledge-lives-in-fetch.md
      - adr/0008-one-call-at-a-time.md
  - Compatibilidad: compatibility.md
  - Cómo contribuir:
      - contributing/docstrings.md
