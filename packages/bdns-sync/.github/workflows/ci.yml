name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    # The suite runs twice: once on in-memory SQLite (the default, no
    # service needed) and once against a real PostgreSQL. The SQL-facing
    # tests pick their engine from BDNS_SYNC_TEST_URL, so the same tests
    # cover both. Without this, "portable SQL" was an untested claim: a
    # bare NULL literal in the version INSERT compiled fine on SQLite and
    # was rejected by PostgreSQL on every single run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: bdns
          POSTGRES_DB: bdns
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry==2.2.1

      - name: Install dependencies
        run: poetry install

      - name: Lint
        run: poetry run ruff check .

      - name: Check formatting
        run: poetry run ruff format --check .

      - name: Check doc references
        run: poetry run python scripts/check_doc_refs.py

      - name: Check docstring conventions
        run: poetry run python scripts/check_docstrings.py

      - name: Build docs
        run: poetry run mkdocs build --strict

      - name: Check site links
        run: poetry run python scripts/check_site_links.py

      - name: Test (SQLite)
        run: poetry run pytest

      - name: Test (PostgreSQL)
        env:
          BDNS_SYNC_TEST_URL: postgresql+psycopg2://postgres:bdns@localhost:5432/bdns
        run: poetry run pytest --no-cov

      - name: Test (DuckDB)
        env:
          BDNS_SYNC_TEST_URL: duckdb:///${{ runner.temp }}/bdns-test.duckdb
        run: poetry run pytest --no-cov

  # bdns-sync is built on bdns-fetch. This job runs the suite against
  # bdns-fetch's main branch instead of the locked release, so a change
  # there that breaks this project shows up before it is released.
  fetch-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.2.1

      - name: Install dependencies
        run: poetry install

      - name: Install bdns-fetch from main
        run: poetry run pip install --force-reinstall --no-deps "git+https://github.com/cruzlorite/bdns-fetch.git@main"

      - name: Test
        run: poetry run pytest --no-cov

  # The image is otherwise built only on release, when a broken Dockerfile
  # would be found with the version already on PyPI.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Build the image
        run: docker build -t bdns-sync:ci .

      - name: Check the image runs
        run: docker run --rm bdns-sync:ci bdns-sync --version
